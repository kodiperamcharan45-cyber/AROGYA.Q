<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AROGYA.Q</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Nunito:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap">
<style>
/* Layout: dark teal app bar (brand, language, Patient | Staff switch) over one 1080px column, pill tabs below.
   Patient pages open with a deck-style hero (clock, check and chat circles); queue tokens are drawn as tickets.
   Staff pages sit behind a sign-in with a lockout, then table and board first. Footer carries copyright and terms.
   Palette and type follow the AROGYA.Q deck: deep teal, mint, coral; DM Sans display, Nunito text, Noto for Indic scripts. */
:root{
  --bg:#F2F8F7; --bg-top:#E3F3EF; --surface:#FFFFFF; --surface-2:#E9F1EF; --ink:#103D3F; --ink-2:#4A6264; --line:#D3E0DE;
  --accent:#0E7C66; --accent-ink:#FFFFFF; --mint:#5DD4B8; --mint-soft:#DDF5EE; --coral:#E8765A;
  --emerg:#B83A22; --emerg-bg:#FDE9E3; --emerg-btn:#B83A22; --emerg-btn-ink:#FFFFFF;
  --warn:#7A5200; --warn-bg:#FFF0CC; --info:#14566B; --info-bg:#DDF0F6;
  --bar-bg:#0F3A3C; --bar-ink:#EAF6F3; --hero-a:#0F3A3C; --hero-b:#1B6E68; --ticket-a:#0F3F40; --ticket-b:#18635F;
  --c1:#D6F2E9; --c1i:#0B6B58; --c2:#FBE0D6; --c2i:#A33A22; --c3:#D4E9F5; --c3i:#14566B;
  --c4:#FBE9C6; --c4i:#7A5200; --c5:#E3DDF5; --c5i:#4B3A8C; --c6:#DDE9E7; --c6i:#103D3F;
  --shadow:0 1px 2px rgba(16,61,63,.05),0 10px 28px rgba(16,61,63,.07);
  --f-display:'DM Sans','Noto Sans Devanagari','Noto Sans Telugu','Noto Sans Tamil',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Nunito','Noto Sans Devanagari','Noto Sans Telugu','Noto Sans Tamil',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B2E30; --bg-top:#0F3A3C; --surface:#134144; --surface-2:#194C4F; --ink:#EAF6F3; --ink-2:#A8C7C2; --line:#27595B;
    --accent:#5DD4B8; --accent-ink:#0D3335; --mint:#5DD4B8; --mint-soft:#1B5654; --coral:#F28B6E;
    --emerg:#FFA58C; --emerg-bg:#4B2B27; --emerg-btn:#FF9C80; --emerg-btn-ink:#3A1710;
    --warn:#F5D58A; --warn-bg:#4A3B17; --info:#9BD8EC; --info-bg:#173F4D;
    --bar-bg:#082527; --hero-a:#0C3234; --hero-b:#175C58;
    --c1:#1D5C55; --c1i:#BDF2E3; --c2:#5A3029; --c2i:#FFC1AE; --c3:#1D4A5A; --c3i:#B6E3F3;
    --c4:#4F3F1A; --c4i:#F7DE9C; --c5:#3A3463; --c5i:#D6CCF5; --c6:#234F51; --c6i:#D3ECE8;
    --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B2E30; --bg-top:#0F3A3C; --surface:#134144; --surface-2:#194C4F; --ink:#EAF6F3; --ink-2:#A8C7C2; --line:#27595B;
  --accent:#5DD4B8; --accent-ink:#0D3335; --mint:#5DD4B8; --mint-soft:#1B5654; --coral:#F28B6E;
  --emerg:#FFA58C; --emerg-bg:#4B2B27; --emerg-btn:#FF9C80; --emerg-btn-ink:#3A1710;
  --warn:#F5D58A; --warn-bg:#4A3B17; --info:#9BD8EC; --info-bg:#173F4D;
  --bar-bg:#082527; --hero-a:#0C3234; --hero-b:#175C58;
  --c1:#1D5C55; --c1i:#BDF2E3; --c2:#5A3029; --c2i:#FFC1AE; --c3:#1D4A5A; --c3i:#B6E3F3;
  --c4:#4F3F1A; --c4i:#F7DE9C; --c5:#3A3463; --c5i:#D6CCF5; --c6:#234F51; --c6i:#D3ECE8;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.25);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background-color:var(--bg);background-image:linear-gradient(180deg,var(--bg-top) 0,var(--bg) 460px);background-repeat:no-repeat;color:var(--ink);font:15px/1.6 var(--f-body);padding-inline:16px;padding-block:0;min-height:100%}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.3;text-wrap:balance;color:var(--ink)}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin-inline:auto;padding-block:24px 0}
.inner{max-width:1080px;margin-inline:auto}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.eyebrow{font:600 12px/1.3 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* app bar */
.bar-wrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar-bg);color:var(--bar-ink);margin-inline:-16px;padding-inline:16px;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px;max-width:1080px;margin-inline:auto}
.brand{display:flex;align-items:center;gap:10px;font:700 21px/1 var(--f-display);letter-spacing:.03em;color:var(--bar-ink)}
.brand i{font-style:normal;color:var(--mint)}
.brand svg{color:var(--mint);flex:none}
.bar-r{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-left:auto}
.langpick{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:999px;padding:0 6px 0 12px;color:var(--bar-ink)}
.langpick select{appearance:none;background:transparent;border:0;color:var(--bar-ink);font:600 14px var(--f-display);padding:8px 8px 8px 2px;cursor:pointer;max-width:130px}
.langpick select option{color:#103D3F;background:#fff}
.switch{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:4px;gap:2px}
.switch button{border:0;background:transparent;border-radius:999px;padding:7px 16px;font:600 14px var(--f-display);color:var(--bar-ink)}
.switch button[aria-selected="true"]{background:var(--mint);color:#0D3335}
.sync{display:flex;align-items:center;gap:7px;font-size:12.5px;color:rgba(234,246,243,.8);width:100%}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mint);flex:none}
.dot.off{background:var(--coral)}

.tabs{display:flex;gap:4px;overflow-x:auto;background:var(--surface-2);border-radius:16px;padding:5px;margin-bottom:24px;align-items:center}
.tabs button{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;white-space:nowrap;padding:10px 16px;border-radius:12px;font:600 15px var(--f-display);color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabs button[aria-selected="true"] .ic{color:var(--accent)}
.tabs .who{margin-left:auto;display:flex;align-items:center;gap:8px;padding-inline:8px;font-size:13px;color:var(--ink-2);white-space:nowrap}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (min-width:920px){.cols{grid-template-columns:minmax(0,1fr) 300px}.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);align-self:start}}
.btn{border:1px solid transparent;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:11px 20px;font:600 15px var(--f-display);box-shadow:0 1px 0 rgba(255,255,255,.15) inset}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.urgent{background:var(--emerg-btn);color:var(--emerg-btn-ink)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn.big{padding:14px 26px;font-size:17px;border-radius:14px}
label.fld{display:flex;flex-direction:column;gap:6px;font:600 13px var(--f-display);color:var(--ink-2);min-width:0}
.inp{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font:400 15px var(--f-body);color:var(--ink)}
.inp:focus-visible{outline-offset:0;border-color:var(--accent)}
.inp:disabled{opacity:.5}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.err{color:var(--emerg);background:var(--emerg-bg);border-radius:12px;padding:10px 14px;font-weight:600}
.note{background:var(--info-bg);color:var(--info);border-radius:12px;padding:12px 14px}
.ok{background:var(--mint-soft);color:var(--ink);border-radius:14px;padding:14px 16px}

/* pills */
.pill{display:inline-block;border-radius:999px;padding:3px 11px;font:600 12px/1.6 var(--f-display);white-space:nowrap}
.pill.booked{background:var(--info-bg);color:var(--info)}
.pill.checked_in{background:var(--warn-bg);color:var(--warn)}
.pill.in_consult{background:var(--mint-soft);color:var(--ink)}
.pill.done{background:var(--surface-2);color:var(--ink-2)}
.pill.cancelled{background:var(--surface-2);color:var(--ink-2);text-decoration:line-through}
.pill.no_show{background:var(--emerg-bg);color:var(--emerg)}
.pill.emerg{background:var(--emerg-btn);color:var(--emerg-btn-ink)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(125deg,var(--hero-a),var(--hero-b));color:#fff;padding:38px 36px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:18px;align-items:center;margin-bottom:24px;border:1px solid rgba(255,255,255,.08)}
.hero h1{color:#fff;font-size:clamp(28px,4.6vw,44px);font-weight:700;letter-spacing:-.01em;margin-block:10px 12px}
.hero p{color:rgba(255,255,255,.86);font-size:16px;max-width:52ch}
.hero .eyebrow-l{font:600 13px/1.3 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--mint)}
.hero-chips{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.hero-chips li{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:999px;padding:8px 14px;font:600 14px var(--f-display)}
.hero-chips .ic{color:var(--mint)}
.hero-art svg{width:100%;height:auto;max-height:250px;display:block}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr);padding:28px 22px}.hero-art{display:none}}

/* booking */
.sh{display:flex;align-items:center;gap:12px}
.sn{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 14px var(--f-display);flex:none}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
.doc{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:46px minmax(0,1fr);gap:2px 12px;align-items:center}
.doc:hover{border-color:var(--accent)}
.doc[aria-pressed="true"]{border-color:var(--accent);background:var(--mint-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.av{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;font:700 16px var(--f-display);flex:none}
.doc .av{grid-row:span 3}
.doc b{font:700 15px var(--f-display);line-height:1.3}
.doc .d2{font-size:13px;color:var(--ink-2)}
.doc .d3{font-size:12.5px;color:var(--accent);font-weight:700}
.doc[aria-pressed="true"] .d2,.doc[aria-pressed="true"] .d3{color:var(--ink)}
.days{display:flex;gap:8px;overflow-x:auto;padding-block:16px 4px}
.day{flex:none;min-width:68px;background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:9px 10px;display:flex;flex-direction:column;align-items:center}
.day span{font-size:12px;color:var(--ink-2)}
.day b{font:700 20px var(--f-display)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px rgba(14,124,102,.3)}
.day[aria-pressed="true"] span{color:var(--accent-ink)}
.day:disabled{opacity:.4;cursor:not-allowed}
.slotgroup{margin-top:16px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin-top:8px}
.slot{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:9px 4px;font:600 14px var(--f-display);font-variant-numeric:tabular-nums}
.slot:hover:not(:disabled){border-color:var(--accent)}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 14px rgba(14,124,102,.28)}
.slot:disabled{opacity:.38;text-decoration:line-through;cursor:not-allowed}
.chan{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.chan button{border:0;background:var(--bg);padding:10px 18px;font:600 14px var(--f-display);color:var(--ink-2)}
.chan button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.after{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
.after li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;font-size:14px}
.after b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--mint-soft);color:var(--accent);font:700 13px var(--f-display)}
.railhead{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));border-radius:var(--r);padding:20px;color:#fff}
.railhead h3{color:#fff}.railhead .after b{background:rgba(255,255,255,.16);color:var(--mint)}
.railhead .after li{color:rgba(255,255,255,.9)}

/* visit */
.visit{display:flex;flex-direction:column;gap:18px}
.vhead{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.vhead .vt{flex:1;min-width:180px}
.vhead h3{font-size:18px}
.vhead .vr{text-align:right}
.steps{display:flex;list-style:none;margin:6px 0 0;padding:0}
.steps li{flex:1;position:relative;text-align:center;font:600 12.5px var(--f-display);color:var(--ink-2);padding-top:36px;min-width:0}
.steps li::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);z-index:1}
.steps li::after{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:var(--line)}
.steps li:first-child::after{display:none}
.steps li.on{color:var(--ink)}
.steps li.on::before{content:"\2713";background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:14px;line-height:24px}
.steps li.on::after,.steps li.now::after{background:var(--accent)}
.steps li.now{color:var(--ink)}
.steps li.now::before{background:var(--surface);border-color:var(--coral);box-shadow:0 0 0 5px rgba(232,118,90,.25)}
.ticket{display:grid;grid-template-columns:200px minmax(0,1fr);background:linear-gradient(120deg,var(--ticket-a),var(--ticket-b));color:#fff;border-radius:20px}
.ticket .stub{position:relative;padding:20px 22px;border-right:2px dashed rgba(255,255,255,.35);display:flex;flex-direction:column;gap:6px;justify-content:center}
.ticket .stub::before,.ticket .stub::after{content:"";position:absolute;right:-12px;width:22px;height:22px;border-radius:50%;background:var(--surface)}
.ticket .stub::before{top:-11px}.ticket .stub::after{bottom:-11px}
.ticket .eyebrow-l{font:600 12px/1.3 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--mint)}
.tok{font:700 40px/1.1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ticket .qstats{padding:20px 22px;align-self:center}
.qstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px}
.qstats div b{display:block;font:700 22px/1.25 var(--f-display);font-variant-numeric:tabular-nums}
.qstats div span{font-size:12.5px;color:rgba(255,255,255,.78)}
@media (max-width:560px){
  .ticket{grid-template-columns:minmax(0,1fr)}
  .ticket .stub{border-right:0;border-bottom:2px dashed rgba(255,255,255,.35)}
  .ticket .stub::before{top:auto;bottom:-11px;left:-11px;right:auto}
  .ticket .stub::after{bottom:-11px;right:-11px}
  .tok{font-size:34px}
}
.pass{display:flex;flex-wrap:wrap;gap:16px;align-items:center;border:2px dashed var(--line);border-radius:16px;padding:14px}
.qr{background:#fff;padding:10px;border-radius:12px;width:156px;max-width:100%;border:1px solid var(--line)}
.qr svg{display:block;width:100%;height:auto}
.qr .idtxt{font:700 18px var(--f-display);color:#103D3F;text-align:center;padding:30px 0}
.stars{display:flex;gap:4px}
.stars button{border:0;background:transparent;font-size:30px;line-height:1;color:var(--line);padding:2px}
.stars button.on{color:var(--coral)}

/* board */
.boardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.bcard.mine{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent),var(--shadow)}
.bcard .bh{display:flex;gap:12px;align-items:center}
.bnow{font:700 36px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.bnowbox{background:var(--bg);border-radius:14px;padding:12px 14px}

/* login */
.login{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);border-radius:28px;overflow:hidden;border:1px solid var(--line);background:var(--surface);max-width:900px;margin-inline:auto;box-shadow:var(--shadow)}
.login .side{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;padding:36px 30px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.login .side h2{color:#fff;font-size:24px}
.login .side p{color:rgba(255,255,255,.86)}
.login .side .big{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);color:var(--mint)}
.login .side .big .ic{width:30px;height:30px}
.login .form{padding:36px 30px;display:flex;flex-direction:column;gap:16px;justify-content:center}
@media (max-width:720px){.login{grid-template-columns:minmax(0,1fr)}.login .side{padding:26px 22px}.login .form{padding:26px 22px}}

/* staff */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:grid;grid-template-columns:40px minmax(0,1fr);gap:2px 12px;align-items:center}
.tile .ico{grid-row:span 3;display:grid;place-items:center;width:40px;height:40px;border-radius:12px}
.tile b{display:block;font:700 28px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.tile span.s{display:block;font-size:12.5px;color:var(--ink-2)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:780px;font-size:14px}
th{background:var(--bar-bg);color:var(--bar-ink);text-align:left;font:600 13px var(--f-display);padding:12px;white-space:nowrap}
td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:var(--mint-soft)}
tr.zebra td{background:var(--surface-2)}
tr.zebra:hover td{background:var(--mint-soft)}
td .acts{display:flex;flex-wrap:wrap;gap:6px}

var SESSIONS=[[540,780],[840,1020]]; /* 9:00-13:00 and 14:00-17:00, in minutes */
var SLOT=15;
var ACTIVE=['booked','checked_in','in_consult','done'];
function pad(n){return String(n).padStart(2,'0')}
function pad3(n){return String(n).padStart(3,'0')}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function docOf(id){return DOCTORS.find(function(d){return d.id===id})||DOCTORS[0]}
function slotsOf(){var out=[];SESSIONS.forEach(function(s){for(var m=s[0];m<s[1];m+=SLOT)out.push(pad(Math.floor(m/60))+':'+pad(m%60))});return out}
function toMin(s){var p=s.split(':');return +p[0]*60+ +p[1]}
function tsOf(date,slot){var d=date.split('-').map(Number),t=slot.split(':').map(Number);return new Date(d[0],d[1]-1,d[2],t[0],t[1],0,0).getTime()}
function fmt12(slot){var p=slot.split(':').map(Number),h=p[0],ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(p[1])+' '+ap}
function isActive(a){return ACTIVE.indexOf(a.status)>=0}
function slotTaken(appts,doctorId,date,slot,exceptId){
  for(var a of appts.values()){
    if(a.id!==exceptId&&a.doctorId===doctorId&&a.date===date&&a.slot===slot&&!a.walkin&&isActive(a))return true;
  }
  return false;
}
function dayList(appts,doctorId,date){return Array.from(appts.values()).filter(function(a){return a.doctorId===doctorId&&a.date===date})}
/* A late arrival queues from the moment they check in, an early one from their slot. */
function effTs(a){var s=a.slot?tsOf(a.date,a.slot):0;return Math.max(s,a.checkedInAt||0)}
function cmpQueue(x,y){
  if(!!x.emergency!==!!y.emergency)return x.emergency?-1:1;
  if(x.emergency&&y.emergency)return (x.emergencyAt||0)-(y.emergencyAt||0)||x.id.localeCompare(y.id);
  return effTs(x)-effTs(y)||(x.checkedInAt||0)-(y.checkedInAt||0)||x.id.localeCompare(y.id);
}
function queueOf(appts,doctorId,date){
  var list=dayList(appts,doctorId,date);
  return {
    list:list,
    waiting:list.filter(function(a){return a.status==='checked_in'}).sort(cmpQueue),
    serving:list.find(function(a){return a.status==='in_consult'})||null
  };
}
/* Token numbers follow arrival order for that doctor and day, so nothing needs a shared counter. */
function tokenOf(appts,a){
  if(!a||!a.checkedInAt)return null;
  var doc=docOf(a.doctorId);
  var arrived=dayList(appts,a.doctorId,a.date).filter(function(x){return x.checkedInAt}).sort(function(x,y){return x.checkedInAt-y.checkedInAt||x.id.localeCompare(y.id)});
  var i=arrived.findIndex(function(x){return x.id===a.id});
  return doc.code+'-'+pad3(i+1);
}
function waitInfo(appts,a){
  var q=queueOf(appts,a.doctorId,a.date),doc=docOf(a.doctorId);
  var idx=q.waiting.findIndex(function(x){return x.id===a.id});
  if(idx<0)return null;
  var mins=Math.round((idx+(q.serving?0.5:0))*doc.avg/5)*5;
  return {ahead:idx,mins:mins,serving:q.serving,next:idx===0&&!q.serving};
}
function clinicElapsed(date,nowTs){
  var today=dstr(new Date(nowTs));
  var full=SESSIONS.reduce(function(s,x){return s+(x[1]-x[0])},0);
  if(date<today)return full;
  if(date>today)return 0;
  var d=new Date(nowTs),nm=d.getHours()*60+d.getMinutes();
  return SESSIONS.reduce(function(s,x){return s+Math.max(0,Math.min(nm,x[1])-x[0])},0);
}
function mean(a){return a.length?a.reduce(function(s,x){return s+x},0)/a.length:null}
function statsFor(appts,date,nowTs){
  var list=Array.from(appts.values()).filter(function(a){return a.date===date&&a.status!=='cancelled'});
  var done=list.filter(function(a){return a.status==='done'}).length;
  var noShow=list.filter(function(a){return a.status==='no_show'}).length;
  var elapsed=clinicElapsed(date,nowTs);
  var perDoc=DOCTORS.map(function(d){
    var l=list.filter(function(a){return a.doctorId===d.id});
    var care=l.filter(function(a){return a.calledAt}).reduce(function(s,a){return s+((a.doneAt||nowTs)-a.calledAt)/60000},0);
    var w=l.filter(function(a){return a.checkedInAt&&a.calledAt}).map(function(a){return (a.calledAt-a.checkedInAt)/60000});
    return {doctor:d,total:l.length,
      seen:l.filter(function(a){return a.status==='done'}).length,
      waiting:l.filter(function(a){return a.status==='checked_in'}).length,
      avgWait:mean(w),util:elapsed?Math.min(1,care/elapsed):null};
  });
  var withUtil=perDoc.filter(function(p){return p.total>0&&p.util!=null}).map(function(p){return p.util});
  var rated=list.filter(function(a){return a.rating});
  var ev=[];
  list.forEach(function(a){
    if(a.checkedInAt){
      var end=a.calledAt||(a.status==='checked_in'?nowTs:a.checkedInAt);
      ev.push([a.checkedInAt,1]);ev.push([end,-1]);
    }
  });
  ev.sort(function(x,y){return x[0]-y[0]||x[1]-y[1]});
  var cur=0,peak=0;ev.forEach(function(e){cur+=e[1];if(cur>peak)peak=cur});
  var hours={};
  list.forEach(function(a){if(a.checkedInAt){var h=new Date(a.checkedInAt).getHours();hours[h]=(hours[h]||0)+1}});
  return {
    total:list.length,done:done,noShow:noShow,
    noShowRate:(done+noShow)?noShow/(done+noShow):null,
    avgWait:mean(list.filter(function(a){return a.checkedInAt&&a.calledAt}).map(function(a){return (a.calledAt-a.checkedInAt)/60000})),
    util:mean(withUtil),sat:mean(rated.map(function(a){return a.rating})),ratedN:rated.length,
    peak:peak,waitingNow:list.filter(function(a){return a.status==='checked_in'}).length,
    perDoc:perDoc,hours:hours
  };
}
function makeSample(nowTs){
  var date=dstr(new Date(nowTs)),slots=slotsOf(),d0=new Date(nowTs),nowMin=d0.getHours()*60+d0.getMinutes();
  var base=Math.min(Math.max(nowMin,570),990),used={},out=[];
  var names=['Aarav Menon','Diya Sharma','Rohan Patil','Isha Nair','Kabir Singh','Meera Joshi','Arjun Das','Sana Fatima','Vihaan Gupta','Tara Pillai','Nikhil Rao','Anika Bose','Dev Kulkarni','Riya Chawla','Imran Sheikh','Leela Menon','Karan Bhatt','Nandini Rao','Yash Thakur','Pooja Iyer','Farah Ali'];

'book.changingsub':['{doc} stays the same. Pick a new day and time.','{doc} वही रहेंगे। नया दिन और समय चुनें।','{doc} అలాగే ఉంటారు. కొత్త రోజు మరియు సమయాన్ని ఎంచుకోండి.','{doc} மாறமாட்டார். புதிய நாளையும் நேரத்தையும் தேர்வு செய்யுங்கள்.'],
'book.readonly':['You have view-only access, so bookings cannot be saved.','आपके पास केवल देखने की अनुमति है, इसलिए बुकिंग सहेजी नहीं जा सकती।','మీకు చూడటానికి మాత్రమే అనుమతి ఉంది, కాబట్టి బుకింగ్‌లు సేవ్ కావు.','உங்களுக்குப் பார்க்க மட்டுமே அனுமதி உள்ளது, எனவே முன்பதிவுகளைச் சேமிக்க முடியாது.'],
'after.title':['After you book','बुक करने के बाद','బుక్ చేసిన తర్వాత','முன்பதிவுக்குப் பிறகு'],
'after.1':['You get a booking ID and a code to show at the front desk.','आपको बुकिंग आईडी और फ्रंट डेस्क पर दिखाने के लिए एक कोड मिलेगा।','మీకు బుకింగ్ ID, ఫ్రంట్ డెస్క్ వద్ద చూపించడానికి ఒక కోడ్ వస్తాయి.','உங்களுக்கு முன்பதிவு ஐடியும், வரவேற்பறையில் காட்ட ஒரு குறியீடும் கிடைக்கும்.'],
'after.2':['Your reminder choice is saved with the booking.','आपकी रिमाइंडर पसंद बुकिंग के साथ सहेजी जाती है।','మీ రిమైండర్ ఎంపిక బుకింగ్‌తో పాటు సేవ్ అవుతుంది.','உங்கள் நினைவூட்டல் தேர்வு முன்பதிவுடன் சேமிக்கப்படும்.'],
'after.3':['On the day, tap Check in when you reach the hospital to get your token.','उस दिन अस्पताल पहुँचकर चेक इन दबाएँ और अपना टोकन पाएँ।','ఆ రోజు ఆసుపత్రికి చేరుకున్నాక చెక్ ఇన్ నొక్కి మీ టోకెన్ పొందండి.','அன்றைய நாளில் மருத்துவமனைக்கு வந்ததும் செக் இன் அழுத்தி டோக்கன் பெறுங்கள்.'],
'after.4':['Follow your place in the queue on your phone and walk in when called.','अपने फ़ोन पर कतार में अपनी जगह देखें और बुलाए जाने पर अंदर जाएँ।','మీ ఫోన్‌లో క్యూలో మీ స్థానాన్ని చూడండి, పిలిచినప్పుడు లోపలికి వెళ్లండి.','உங்கள் தொலைபேசியில் வரிசையில் உங்கள் இடத்தைப் பாருங்கள், அழைக்கப்பட்டதும் உள்ளே செல்லுங்கள்.'],
'err.name':["Enter the patient's full name.",'मरीज़ का पूरा नाम लिखें।','రోగి పూర్తి పేరు నమోదు చేయండి.','நோயாளியின் முழுப் பெயரை உள்ளிடுங்கள்.'],
'err.phone':['Enter a 10-digit mobile number.','10 अंकों का मोबाइल नंबर लिखें।','10 అంకెల మొబైల్ నంబర్ నమోదు చేయండి.','10 இலக்க மொபைல் எண்ணை உள்ளிடுங்கள்.'],
'err.slot':['Pick a time slot.','समय स्लॉट चुनें।','సమయ స్లాట్‌ని ఎంచుకోండి.','ஒரு நேரத்தைத் தேர்வு செய்யுங்கள்.'],
'err.taken':['That time was just taken. Pick another slot.','वह समय अभी-अभी बुक हो गया। कोई और स्लॉट चुनें।','ఆ సమయం ఇప్పుడే బుక్ అయింది. మరో స్లాట్‌ని ఎంచుకోండి.','அந்த நேரம் இப்போதுதான் பதிவாகிவிட்டது. வேறு நேரத்தைத் தேர்வு செய்யுங்கள்.'],

'err.move':['Could not move the booking. Try again.','बुकिंग बदली नहीं जा सकी। फिर कोशिश करें।','బుకింగ్‌ని మార్చలేకపోయాం. మళ్లీ ప్రయత్నించండి.','முன்பதிவை மாற்ற முடியவில்லை. மீண்டும் முயலுங்கள்.'],
'err.view':['You have view-only access, so this change was not saved.','आपके पास केवल देखने की अनुमति है, इसलिए यह बदलाव सहेजा नहीं गया।','మీకు చూడటానికి మాత్రమే అనుమతి ఉంది, కాబట్టి ఈ మార్పు సేవ్ కాలేదు.','உங்களுக்குப் பார்க்க மட்டுமே அனுமதி உள்ளது, எனவே இந்த மாற்றம் சேமிக்கப்படவில்லை.'],
'err.conn':['Could not save. Check your connection and try again.','सहेजा नहीं जा सका। अपना कनेक्शन जाँचें और फिर कोशिश करें।','సేవ్ కాలేదు. మీ కనెక్షన్‌ని చూసి మళ్లీ ప్రయత్నించండి.','சேமிக்க முடியவில்லை. இணைப்பைச் சரிபார்த்து மீண்டும் முயலுங்கள்.'],
'toast.moved':['Booking moved to {when}.','बुकिंग {when} पर बदल दी गई।','బుకింగ్ {when}కి మార్చబడింది.','முன்பதிவு {when} அன்றுக்கு மாற்றப்பட்டது.'],

'visit.e.b':['Book a slot and it shows up here with your queue token on the day.','स्लॉट बुक करें, वह उस दिन आपके कतार टोकन के साथ यहाँ दिखेगा।','స్లాట్ బుక్ చేస్తే, ఆ రోజున మీ క్యూ టోకెన్‌తో పాటు ఇక్కడ కనిపిస్తుంది.','நேரத்தை முன்பதிவு செய்தால், அன்றைய நாளில் உங்கள் வரிசை டோக்கனுடன் இங்கே தெரியும்.'],

'visit.n.b':['Book your next visit when you need it.','ज़रूरत होने पर अगली विज़िट बुक करें।','అవసరమైనప్పుడు తదుపరి సందర్శనను బుక్ చేయండి.','தேவைப்படும்போது அடுத்த வருகையை முன்பதிவு செய்யுங்கள்.'],

'banner.t':['Booked. Booking ID {id}. Your visit is {when}. Reminders go by {ch}.','बुकिंग हो गई। बुकिंग आईडी {id}। आपकी विज़िट {when} है। रिमाइंडर {ch} से आएँगे।','బుక్ అయింది. బుకింగ్ ID {id}. మీ సందర్శన {when}. రిమైండర్లు {ch} ద్వారా వస్తాయి.','முன்பதிவு ஆனது. முன்பதிவு ஐடி {id}. உங்கள் வருகை {when}. நினைவூட்டல்கள் {ch} மூலம் வரும்.'],

'checkin.hint':['Tap when you reach the hospital. You will get a queue token.','अस्पताल पहुँचने पर दबाएँ। आपको कतार टोकन मिलेगा।','ఆసుపత్రికి చేరుకున్నాక నొక్కండి. మీకు క్యూ టోకెన్ వస్తుంది.','மருத்துவமனைக்கு வந்ததும் அழுத்துங்கள். உங்களுக்கு வரிசை டோக்கன் கிடைக்கும்.'],

'tok.hint':['You can wait anywhere comfortable nearby. This page updates as the queue moves.','आप पास में किसी भी आरामदायक जगह इंतज़ार कर सकते हैं। कतार बढ़ने पर यह पेज अपने आप अपडेट होता है।','మీరు దగ్గరలో ఎక్కడైనా సౌకర్యంగా వేచి ఉండవచ్చు. క్యూ కదిలినప్పుడు ఈ పేజీ అప్‌డేట్ అవుతుంది.','அருகில் வசதியான எந்த இடத்திலும் காத்திருக்கலாம். வரிசை நகரும்போது இந்தப் பக்கம் புதுப்பிக்கப்படும்.'],
'tok.priority':['Priority case. You will be seen first.','प्राथमिकता वाला मामला। आपको सबसे पहले देखा जाएगा।','ప్రాధాన్యత కేసు. మిమ్మల్ని ముందుగా చూస్తారు.','முன்னுரிமை நிலை. உங்களை முதலில் பார்ப்பார்கள்.'],

'noshow.note':['This visit was marked as missed. You can book a new slot any time.','यह विज़िट छूटी हुई मानी गई है। आप कभी भी नया स्लॉट बुक कर सकते हैं।','ఈ సందర్శన మిస్ అయినట్లు గుర్తించబడింది. మీరు ఎప్పుడైనా కొత్త స్లాట్ బుక్ చేయవచ్చు.','இந்த வருகை தவறவிடப்பட்டதாகக் குறிக்கப்பட்டது. எப்போது வேண்டுமானாலும் புதிய நேரத்தை முன்பதிவு செய்யலாம்.'],

'lookup.s':['Booked on another device or for a family member? Enter the booking ID or the mobile number used.','किसी दूसरे डिवाइस पर या परिवार के सदस्य के लिए बुक किया? बुकिंग आईडी या इस्तेमाल किया गया मोबाइल नंबर लिखें।','మరో పరికరంలో లేదా కుటుంబ సభ్యుల కోసం బుక్ చేశారా? బుకింగ్ ID లేదా ఉపయోగించిన మొబైల్ నంబర్ నమోదు చేయండి.','வேறொரு சாதனத்தில் அல்லது குடும்ப உறுப்பினருக்காக முன்பதிவு செய்தீர்களா? முன்பதிவு ஐடி அல்லது பயன்படுத்திய மொபைல் எண்ணை உள்ளிடுங்கள்.'],

'login.s':['For hospital staff only. Patients do not need to sign in.','केवल अस्पताल कर्मचारियों के लिए। मरीज़ों को साइन-इन की ज़रूरत नहीं है।','ఆసుపత్రి సిబ్బందికి మాత్రమే. రోగులు సైన్-ఇన్ చేయాల్సిన అవసరం లేదు.','மருத்துவமனை பணியாளர்களுக்கு மட்டும். நோயாளிகள் உள்நுழைய வேண்டியதில்லை.'],

'login.bad':['Wrong staff ID or PIN. {n} tries left.','स्टाफ आईडी या पिन गलत है। {n} कोशिशें बाकी हैं।','సిబ్బంది ID లేదా PIN తప్పు. {n} ప్రయత్నాలు మిగిలి ఉన్నాయి.','பணியாளர் ஐடி அல்லது PIN தவறு. {n} முயற்சிகள் மீதமுள்ளன.'],
'login.lock':['Too many wrong attempts. Sign-in is locked for {m}:{s}.','बहुत ज़्यादा गलत कोशिशें। साइन-इन {m}:{s} के लिए बंद है।','చాలా తప్పు ప్రయత్నాలు. సైన్-ఇన్ {m}:{s} వరకు లాక్ అయింది.','அதிக தவறான முயற்சிகள். உள்நுழைவு {m}:{s} நேரத்திற்குப் பூட்டப்பட்டுள்ளது.'],
'login.rule':['Sign-in locks for {min} minutes after {max} wrong attempts.','{max} गलत कोशिशों के बाद साइन-इन {min} मिनट के लिए बंद हो जाता है।','{max} తప్పు ప్రయత్నాల తర్వాత సైన్-ఇన్ {min} నిమిషాల పాటు లాక్ అవుతుంది.','{max} தவறான முயற்சிகளுக்குப் பிறகு உள்நுழைவு {min} நிமிடங்கள் பூட்டப்படும்.'],

'login.hb':['Staff tools show patient names and phone numbers, so they open only after sign-in.','स्टाफ टूल में मरीज़ों के नाम और फ़ोन नंबर दिखते हैं, इसलिए वे साइन-इन के बाद ही खुलते हैं।','సిబ్బంది సాధనాల్లో రోగుల పేర్లు, ఫోన్ నంబర్లు కనిపిస్తాయి, కాబట్టి అవి సైన్-ఇన్ తర్వాతే తెరుచుకుంటాయి.','பணியாளர் கருவிகளில் நோயாளிகளின் பெயர்கள், தொலைபேசி எண்கள் தெரியும், அதனால் உள்நுழைந்த பின்பே திறக்கும்.'],

'plogin.s':['Sign in with your mobile number to book visits and follow your queue.','अपॉइंटमेंट बुक करने और कतार देखने के लिए अपने मोबाइल नंबर से साइन इन करें।','అపాయింట్‌మెంట్లు బుక్ చేయడానికి, క్యూను చూడటానికి మీ మొబైల్ నంబర్‌తో సైన్ ఇన్ చేయండి.','முன்பதிவு செய்யவும் வரிசையைப் பார்க்கவும் உங்கள் மொபைல் எண்ணுடன் உள்நுழையுங்கள்.'],

'plogin.code':['4-digit code','4 अंकों का कोड','4 అంకెల కోడ్','4 இலக்கக் குறியீடு'],

'plogin.sent':['Code sent to {p}. It works for {m} minutes.','कोड {p} पर भेजा गया। यह {m} मिनट तक मान्य है।','కోడ్ {p}కి పంపబడింది. ఇది {m} నిమిషాలు పని చేస్తుంది.','குறியீடு {p} எண்ணுக்கு அனுப்பப்பட்டது. இது {m} நிமிடங்கள் செல்லும்.'],
'plogin.demo':['Demo mode: no SMS is sent. Your code is shown here instead.','डेमो मोड: कोई SMS नहीं भेजा जाता। आपका कोड यहीं दिखाया गया है।','డెమో మోడ్: SMS పంపబడదు. మీ కోడ్ ఇక్కడే చూపబడింది.','டெமோ முறை: SMS அனுப்பப்படாது. உங்கள் குறியீடு இங்கே காட்டப்படுகிறது.'],

'plogin.expired':['That code has expired. Ask for a new one.','वह कोड समाप्त हो गया है। नया कोड मँगवाएँ।','ఆ కోడ్ గడువు ముగిసింది. కొత్తది అడగండి.','அந்தக் குறியீடு காலாவதியாகிவிட்டது. புதியதைக் கேளுங்கள்.'],
'plogin.lock':['Too many wrong codes. Sign-in is locked for {m}:{s}.','बहुत ज़्यादा गलत कोड। साइन-इन {m}:{s} के लिए बंद है।','చాలా తప్పు కోడ్‌లు. సైన్-ఇన్ {m}:{s} వరకు లాక్ అయింది.','அதிக தவறான குறியீடுகள். உள்நுழைவு {m}:{s} நேரத்திற்குப் பூட்டப்பட்டுள்ளது.'],
'plogin.reqlock':['Too many codes requested. Try again in {m}:{s}.','बहुत ज़्यादा कोड मँगवाए गए। {m}:{s} बाद फिर कोशिश करें।','చాలా కోడ్‌లు అడిగారు. {m}:{s} తర్వాత మళ్లీ ప్రయత్నించండి.','அதிகமான குறியீடுகள் கோரப்பட்டன. {m}:{s} கழித்து மீண்டும் முயலுங்கள்.'],

'plogin.h':['Your bookings stay private','आपकी बुकिंग निजी रहती हैं','మీ బుకింగ్‌లు ప్రైవేట్‌గా ఉంటాయి','உங்கள் முன்பதிவுகள் தனிப்பட்டவை'],
'plogin.hb':['A one-time code confirms the number is yours before any booking details are shown.','कोई भी बुकिंग विवरण दिखाने से पहले एक बार का कोड पुष्टि करता है कि नंबर आपका है।','బుకింగ్ వివరాలు చూపే ముందు, ఆ నంబర్ మీదేనని ఒకసారి వాడే కోడ్ నిర్ధారిస్తుంది.','முன்பதிவு விவரங்கள் காட்டப்படும் முன், அந்த எண் உங்களுடையது என்பதை ஒருமுறை குறியீடு உறுதி செய்கிறது.'],
'plogin.rule':['Sign-in locks for {min} minutes after {max} wrong codes. You can request {req} codes per {min} minutes.','{max} गलत कोड के बाद साइन-इन {min} मिनट के लिए बंद हो जाता है। {min} मिनट में {req} कोड मँगवा सकते हैं।','{max} తప్పు కోడ్‌ల తర్వాత సైన్-ఇన్ {min} నిమిషాలు లాక్ అవుతుంది. {min} నిమిషాల్లో {req} కోడ్‌లు అడగవచ్చు.','{max} தவறான குறியீடுகளுக்குப் பிறகு உள்நுழைவு {min} நிமிடங்கள் பூட்டப்படும். {min} நிமிடங்களில் {req} குறியீடுகள் கோரலாம்.'],

'terms.2h':['Using the app','ऐप का उपयोग','యాప్ వినియోగం','செயலியைப் பயன்படுத்துதல்'],
'terms.2':["Use AROGYA.Q only to book, change or cancel your own or a family member's appointments and to follow your queue. Do not misuse it, try to reach other people's data, or interfere with how it works.",'AROGYA.Q का उपयोग केवल अपनी या परिवार के सदस्य की अपॉइंटमेंट बुक, बदलने या रद्द करने और अपनी कतार देखने के लिए करें। इसका दुरुपयोग न करें, दूसरों का डेटा देखने की कोशिश न करें और इसके काम में बाधा न डालें।','AROGYA.Q ని మీ లేదా కుటుంబ సభ్యుల అపాయింట్‌మెంట్‌లను బుక్ చేయడానికి, మార్చడానికి లేదా రద్దు చేయడానికి మరియు మీ క్యూను అనుసరించడానికి మాత్రమే ఉపయోగించండి. దుర్వినియోగం చేయవద్దు, ఇతరుల డేటాను చూడటానికి ప్రయత్నించవద్దు, దాని పనితీరుకు అంతరాయం కలిగించవద్దు.','AROGYA.Q ஐ உங்கள் அல்லது குடும்ப உறுப்பினரின் முன்பதிவுகளைப் பதிவு செய்ய, மாற்ற அல்லது ரத்து செய்ய மற்றும் உங்கள் வரிசையைப் பின்தொடர மட்டுமே பயன்படுத்துங்கள். தவறாகப் பயன்படுத்தவோ, பிறரின் தரவை அணுக முயலவோ, செயல்பாட்டில் குறுக்கிடவோ கூடாது.'],
'terms.3h':['Not medical advice','यह चिकित्सा सलाह नहीं है','వైద్య సలహా కాదు','மருத்துவ ஆலோசனை அல்ல'],
'terms.3':['AROGYA.Q manages appointments and queues. It does not give medical advice, diagnosis or treatment. In an emergency, call your local emergency number or go to the nearest Casualty department.','AROGYA.Q अपॉइंटमेंट और कतार का प्रबंधन करता है। यह चिकित्सा सलाह, निदान या इलाज नहीं देता। आपातकाल में अपने स्थानीय आपातकालीन नंबर पर कॉल करें या नज़दीकी कैज़ुअल्टी विभाग जाएँ।','AROGYA.Q అపాయింట్‌మెంట్‌లు మరియు క్యూలను నిర్వహిస్తుంది. ఇది వైద్య సలహా, రోగ నిర్ధారణ లేదా చికిత్స ఇవ్వదు. అత్యవసర పరిస్థితిలో మీ స్థానిక అత్యవసర నంబర్‌కు కాల్ చేయండి లేదా సమీపంలోని కాజువాల్టీ విభాగానికి వెళ్లండి.','AROGYA.Q முன்பதிவுகளையும் வரிசைகளையும் நிர்வகிக்கிறது. இது மருத்துவ ஆலோசனை, நோய் கண்டறிதல் அல்லது சிகிச்சை வழங்காது. அவசர நிலையில் உங்கள் உள்ளூர் அவசர எண்ணை அழைக்கவும் அல்லது அருகிலுள்ள விபத்து சிகிச்சைப் பிரிவுக்குச் செல்லவும்.'],

  var row=D[key],i=LANGS.indexOf(lang);
  var s=row?(row[i>=0?i:0]||row[0]):key;
  return s.replace(/\{(\w+)\}/g,function(_,k){return vars&&vars[k]!=null?vars[k]:''});
}
function pickLang(){
  try{var l=localStorage.getItem('aq.lang');if(LANGS.indexOf(l)>=0)return l}catch(_){}
  var n=(navigator.language||'en').slice(0,2);
  return LANGS.indexOf(n)>=0?n:'en';
}

function todayStr(){return dstr(new Date())}
function addDays(n){var d=new Date();return dstr(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n))}
function dayParts(date,lang){
  var p=date.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]),loc=LOC[lang||S.lang]||'en-IN';
  return {wd:d.toLocaleDateString(loc,{weekday:'short'}),n:d.getDate(),mo:d.toLocaleDateString(loc,{month:'short'})};
}
function dLabel(date,lang){
  lang=lang||S.lang;
  if(date===todayStr())return tl(lang,'today');

}

function newId(){
  var al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=new Uint8Array(5),s='';
  try{crypto.getRandomValues(b)}catch(_){for(var i=0;i<5;i++)b[i]=Math.floor(Math.random()*256)}
  for(var j=0;j<5;j++)s+=al[b[j]%al.length];
  return 'AQ-'+s;
}

/* ---------- attempt limits (kept on this device) ---------- */
var memLim={};
function limState(key){
  try{var j=JSON.parse(localStorage.getItem('aq.lim.'+key)||'null');if(j)return j}catch(_){}
  return memLim[key]||{n:0,until:0};
}
function limSave(key,s){memLim[key]=s;try{localStorage.setItem('aq.lim.'+key,JSON.stringify(s))}catch(_){}}
function limStatus(key){
  var s=limState(key),now=Date.now();
  if(s.until&&s.until<=now){s={n:0,until:0};limSave(key,s)}
  return {locked:s.until>now,remainMs:Math.max(0,s.until-now),left:Math.max(0,LIM[key].max-(s.n||0))};
}
function limFail(key){
  var s=limState(key);s.n=(s.n||0)+1;
  if(s.n>=LIM[key].max)s.until=Date.now()+LIM[key].lockMs;
  limSave(key,s);return limStatus(key);
}
function limReset(key){limSave(key,{n:0,until:0})}
function mmss(ms){var s=Math.ceil(ms/1000);return {m:Math.floor(s/60),s:pad(s%60)}}
var lockTimer=null;
function ensureTicker(){
  if(lockTimer)return;
  lockTimer=setInterval(function(){
    if(!limStatus('staff').locked&&!limStatus('lookup').locked&&!limStatus('patient').locked&&!limStatus('otp').locked){clearInterval(lockTimer);lockTimer=null}
    render();
  },1000);
}

/* ---------- store: shared database when available, this page only otherwise ---------- */
var Store={
  db:null,uid:null,appts:new Map(),subs:[],chain:new Map(),
  on:function(fn){this.subs.push(fn)},
  emit:function(){this.subs.forEach(function(f){f()})},
  serial:function(id,fn){var p=(this.chain.get(id)||Promise.resolve()).catch(function(){}).then(fn);this.chain.set(id,p);return p},
  create:function(doc){
    var self=this;
    if(this.db)return this.serial(doc.id,function(){return self.db.collection('appts').doc(doc.id).set(doc)});
    this.appts.set(doc.id,doc);this.emit();return Promise.resolve();
  },
  patch:function(id,p){
    var self=this;
    if(this.db)return this.serial(id,function(){return self.db.collection('appts').doc(id).update(p)});
    var a=this.appts.get(id);if(a){this.appts.set(id,Object.assign({},a,p));this.emit()}
    return Promise.resolve();
  },
  remove:function(id){
    var self=this;
    if(this.db)return this.serial(id,function(){return self.db.collection('appts').doc(id).delete()});
    this.appts.delete(id);this.emit();return Promise.resolve();
  }
};

/* ---------- slot logic ---------- */
function freeSlots(doctorId,date,exceptId){
  var now=Date.now();
  return slotsOf().filter(function(s){return tsOf(date,s)>now&&!slotTaken(Store.appts,doctorId,date,s,exceptId)});
}
function nextFree(doctorId){
  for(var i=0;i<7;i++){var d=addDays(i),f=freeSlots(doctorId,d);if(f.length)return {date:d,slot:f[0]}}
  return null;
}
function ensureDate(exceptId){
  var f=S.date?freeSlots(S.docId,S.date,exceptId):[];
  if(!S.date||!f.length){
    var n=nextFree(S.docId);S.date=n?n.date:todayStr();
    f=freeSlots(S.docId,S.date,exceptId);
  }
  if(S.slot&&f.indexOf(S.slot)<0)S.slot=null;
}
function claimSlot(doctorId,date,slot,apptId){
  if(!Store.db)return Promise.resolve(true);
  var ref=Store.db.doc('slots/'+doctorId+'_'+date+'_'+slot.replace(':',''));
  return ref.acquire({holder:apptId,ttlMs:5000}).then(function(l){
    if(!l.acquired)return false;
    return ref.get().then(function(snap){
      if(snap.exists){
        var cur=snap.data().apptId,a=Store.appts.get(cur);
        var held=cur&&cur!==apptId&&(!a||(isActive(a)&&a.doctorId===doctorId&&a.date===date&&a.slot===slot));
        if(held)return false;
      }
      return ref.set({apptId:apptId,doctorId:doctorId,date:date,slot:slot}).then(function(){return true});
    });
  }).catch(function(){return !slotTaken(Store.appts,doctorId,date,slot,apptId)});
}

/* ---------- actions ---------- */
function run(fn,okMsg){
  return Promise.resolve().then(fn).then(function(){if(okMsg)toast(okMsg)}).catch(function(e){
    toast(e&&e.code==='invalid_argument'?t('err.view'):t('err.conn'));
  });
}
function setErr(msg,focusId){
  S.err=msg;render();
  if(focusId){var el=document.getElementById(focusId);if(el)el.focus()}
}
function doBook(){
  var f=S.form,phone=normPhone(f.phone);
  if(f.name.trim().length<2)return setErr(t('err.name'),'f-name');
  if(!phone)return setErr(t('err.phone'),'f-phone');
  if(!S.slot)return setErr(t('err.slot'));
  S.err='';S.busy=true;render();
  var id=newId(),doctorId=S.docId,date=S.date,slot=S.slot;
  claimSlot(doctorId,date,slot,id).then(function(ok){
    if(!ok){S.busy=false;S.slot=null;S.err=t('err.taken');render();return}
    var a={id:id,uid:Store.uid||null,name:f.name.trim(),phone:phone,age:f.age?+f.age:null,reason:f.reason.trim(),
      doctorId:doctorId,date:date,slot:slot,channel:f.channel,status:'booked',emergency:false,emergencyAt:null,walkin:false,
      createdAt:Date.now(),checkedInAt:null,calledAt:null,doneAt:null,rating:null,sample:false};
    return Store.create(a).then(function(){
      remember(id,phone);S.banner={id:id};S.form.reason='';S.slot=null;S.pTab='visit';S.busy=false;render();window.scrollTo(0,0);
    });
  }).catch(function(e){S.busy=false;S.err=e&&e.code==='invalid_argument'?t('book.readonly'):t('err.save');render()});
}
function doResched(){
  var a=Store.appts.get(S.resched);
  if(!a||!S.slot)return;
  S.busy=true;render();
  var newDate=S.date;
  claimSlot(a.doctorId,newDate,S.slot,a.id).then(function(ok){
    if(!ok){S.busy=false;S.slot=null;S.err=t('err.taken');render();return}
    return Store.patch(a.id,{date:newDate,slot:S.slot}).then(function(){
      S.resched=null;S.slot=null;S.busy=false;S.pTab='visit';render();toast(t('toast.moved',{when:dLabel(newDate)}));
    });
  }).catch(function(){S.busy=false;S.err=t('err.move');render()});
}
function checkIn(id,via){
  var a=Store.appts.get(id);
  if(!a||a.status!=='booked')return;
  run(function(){return Store.patch(id,{status:'checked_in',checkedInAt:Date.now(),via:via})},via==='app'?t('toast.checked'):'Checked in.');
}
function callNext(doctorId){
  var q=queueOf(Store.appts,doctorId,todayStr());
  if(q.serving)return toast('Finish the current visit first.');
  if(!q.waiting.length)return toast('Nobody is waiting.');
  run(function(){return Store.patch(q.waiting[0].id,{status:'in_consult',calledAt:Date.now()})});
}
function setStatus(id,status,extra){run(function(){return Store.patch(id,Object.assign({status:status},extra||{}))})}
function setEmergency(id,on){run(function(){return Store.patch(id,{emergency:on,emergencyAt:on?Date.now():null})},on?'Moved to the front of the queue.':'Priority removed.')}
function addWalkIn(){

function loadSample(){

function clearSample(){

function reminderText(a){

  return 'Hello '+first+', this is a reminder from AROGYA.Q. Your visit with '+d.name+' ('+d.dept+') is '+dLabel(a.date,'en').toLowerCase()+' at '+fmt12(a.slot)+'. Booking ID '+a.id+'. Please arrive 10 minutes early and check in on the app.';

function copyText(txt){
  var done=function(){toast('Copied.')};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){toast('Copy is blocked here. Select the text and copy it.')})}
  else toast('Copy is blocked here. Select the text and copy it.');
}
function mineList(){
  var today=todayStr();
  var list=Array.from(Store.appts.values()).filter(function(a){
    return (Store.uid&&a.uid===Store.uid)||ME.ids.indexOf(a.id)>=0||(a.phone&&ME.phones.indexOf(a.phone)>=0);
  });
  var open=function(a){return (a.status==='booked'||a.status==='checked_in'||a.status==='in_consult')&&a.date>=today};
  var up=list.filter(open).sort(function(x,y){return (x.date+x.slot).localeCompare(y.date+y.slot)});
  var past=list.filter(function(a){return !open(a)}).sort(function(x,y){return (y.date+y.slot).localeCompare(x.date+x.slot)});
  return {up:up,past:past};
}
function doLogin(){
  var st=limStatus('staff');
  if(st.locked){render();return}
  var id=(S.login.id||'').trim().toUpperCase(),pin=S.login.pin||'';
  if(id===STAFF.id&&pin===STAFF.pin){
    limReset('staff');S.staffAuth=id;S.login={id:'',pin:''};S.loginBad=false;
    try{sessionStorage.setItem('aq.staff',id)}catch(_){}
    render();return;
  }
  limFail('staff');S.login.pin='';S.loginBad=true;ensureTicker();render();
  var el=document.getElementById('l-pin');if(el&&!limStatus('staff').locked)el.focus();
}
function newCode(){var b=new Uint16Array(1);try{crypto.getRandomValues(b)}catch(_){b[0]=Math.floor(Math.random()*65535)}return String(1000+(b[0]%9000))}
function doSendOtp(){
  if(limStatus('otp').locked||limStatus('patient').locked){render();return}
  var ph=normPhone(S.pl.phone);
  if(!ph){S.plMsg={k:'phone'};render();var e=document.getElementById('p-phone');if(e)e.focus();return}
  S.pl.phone=ph;S.pl.otp=(ph==='1234567890')?'1234':newCode();S.pl.otpAt=Date.now();S.pl.code='';S.pl.step='code';S.plMsg={k:'sent'};
  if(limFail('otp').locked)ensureTicker();
  render();var c=document.getElementById('p-code');if(c)c.focus();
}
function doVerify(){
  if(limStatus('patient').locked){render();return}
  if(!S.pl.otp||Date.now()-S.pl.otpAt>OTP_MS){S.pl.otp=null;S.pl.step='phone';S.pl.code='';S.plMsg={k:'expired'};render();return}
  if(S.pl.code.trim()===S.pl.otp){
    var ph=S.pl.phone;limReset('patient');limReset('otp');
    S.patAuth=ph;try{sessionStorage.setItem('aq.patient',ph)}catch(_){}
    remember(null,ph);if(!S.form.phone)S.form.phone=ph;
    S.pl={phone:'',code:'',step:'phone',otp:null,otpAt:0};S.plMsg=null;S.pTab='book';render();window.scrollTo(0,0);return;
  }
  var r=limFail('patient');S.pl.code='';S.plMsg={k:'bad'};
  if(r.locked){S.pl.otp=null;S.pl.step='phone';ensureTicker()}
  render();var c=document.getElementById('p-code');if(c)c.focus();
}
function patSignOut(){S.patAuth=null;S.plMsg=null;S.pl={phone:'',code:'',step:'phone',otp:null,otpAt:0};try{sessionStorage.removeItem('aq.patient')}catch(_){};render();window.scrollTo(0,0)}
function signOut(){S.staffAuth=null;S.loginBad=false;try{sessionStorage.removeItem('aq.staff')}catch(_){};S.role='patient';render()}
function doLookup(){
  var st=limStatus('lookup');
  if(st.locked){render();return}
  var el=document.getElementById('lookup'),raw=(el&&el.value||'').trim(),found=false;
  if(/^aq-/i.test(raw)){var a=Store.appts.get(raw.toUpperCase());if(a){remember(a.id,null);found=true}}
  else{var p=normPhone(raw);if(p&&Array.from(Store.appts.values()).some(function(x){return x.phone===p})){remember(null,p);found=true}}
  if(found){limReset('lookup');S.lookupMsg={ok:true}}
  else{var r=limFail('lookup');S.lookupMsg={ok:false};if(r.locked)ensureTicker()}
  render();
}

  var d=docOf(a.doctorId),today=todayStr(),isToday=a.date===today;

  var stepper=stage==null?'':'<ol class="steps">'+[1,2,3,4].map(function(n,i){return '<li class="'+(i<stage?'on':i===stage?(a.status==='done'?'on':'now'):'')+'">'+t('step.'+n)+'</li>'}).join('')+'</ol>';
  var body='';
  if(a.status==='booked'){
    body=isToday?'<div class="row"><button class="btn big" data-act="checkin" data-id="'+a.id+'">'+t('checkin.btn')+'</button><span class="muted small" style="flex:1;min-width:200px">'+t('checkin.hint')+'</span></div>':
      '<p class="muted small">'+t(a.date>today?'checkin.later':'checkin.old')+'</p>';

      '<button class="btn ghost sm" data-act="qr" data-id="'+a.id+'">'+t(S.qr[a.id]?'qr.hide':'qr.show')+'</button>'+

        '<button class="btn ghost sm" data-act="cancel" data-id="'+a.id+'">'+t('cancel')+'</button>')+'</div>'+(S.qr[a.id]?qrHtml(a.id):'');
  }else if(a.status==='checked_in'){
    var w=waitInfo(Store.appts,a),tok=tokenOf(Store.appts,a);
    body=(a.emergency?'<div class="err">'+t('tok.priority')+'</div>':'')+
      '<div class="ticket"><div class="stub"><span class="eyebrow-l">'+t('tok.label')+'</span><div class="tok">'+tok+'</div></div><div class="qstats">'+

/* ---------- render ---------- */
function render(){
  var main=$('#main'),ae=document.activeElement,keep=null;
  if(ae&&ae.id&&main.contains(ae))keep={id:ae.id,s:ae.selectionStart,e:ae.selectionEnd};
  var sy=window.scrollY;
  document.documentElement.lang=S.lang;
  var sel=$('#lang');if(sel){if(sel.value!==S.lang)sel.value=S.lang;sel.setAttribute('aria-label',t('lang.label'))}
  renderHeader();renderFooter();
  var html;
  if(S.role==='patient'&&!S.patAuth)html=viewPatientLogin();
  else if(S.role==='patient')html=S.pTab==='book'?viewBook():S.pTab==='visit'?viewVisit():viewBoard();
  else if(!S.staffAuth)html=viewLogin();
  else html=S.sTab==='desk'?viewDesk():S.sTab==='doctor'?viewDoctor():viewInsights();
  main.innerHTML=html;
  renderModal();
  if(keep){
    var el=document.getElementById(keep.id);
    if(el&&!el.disabled){el.focus({preventScroll:true});try{if(keep.s!=null)el.setSelectionRange(keep.s,keep.e)}catch(_){}}
  }
  window.scrollTo(0,sy);
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  var act=b.dataset.act,v=b.dataset.v,id=b.dataset.id;
  if(act==='termsbg'){if(e.target!==b)return;S.terms=false;render();return}
  switch(act){
    case 'role':S.role=v;render();window.scrollTo(0,0);break;
    case 'tab':if(S.role==='patient'){S.pTab=v;if(v!=='book'&&S.resched){S.resched=null}}else S.sTab=v;render();window.scrollTo(0,0);break;
    case 'doc':S.docId=v;S.slot=null;S.date=null;S.err='';render();break;
    case 'date':S.date=v;S.slot=null;S.err='';render();break;
    case 'slot':S.slot=v;S.err='';render();break;
    case 'chan':S.form.channel=v;render();break;
    case 'book':doBook();break;
    case 'resched':doResched();break;
    case 'startresched':S.resched=id;S.slot=null;S.date=null;S.err='';S.pTab='book';render();window.scrollTo(0,0);break;
    case 'cancelresched':S.resched=null;S.slot=null;S.pTab='visit';render();break;
    case 'dismiss':S.banner=null;render();break;
    case 'checkin':checkIn(id,b.dataset.via||'app');break;
    case 'qr':S.qr[id]=!S.qr[id];render();break;
    case 'cancel':S.cancelId=id;render();break;
    case 'cancelno':S.cancelId=null;render();break;
    case 'cancelyes':S.cancelId=null;setStatus(id,'cancelled',{cancelledAt:Date.now()});break;
    case 'rate':run(function(){return Store.patch(id,{rating:+v})},t('toast.thanks'));break;
    case 'lookup':doLookup();break;
    case 'terms':S.terms=!S.terms;render();break;
    case 'signout':signOut();break;
    case 'psubmit':if(S.pl.step==='code')doVerify();else doSendOtp();break;
    case 'slogin':doLogin();break;
    case 'psignout':patSignOut();break;
    case 'pchange':S.pl.step='phone';S.pl.code='';S.pl.otp=null;S.plMsg=null;render();break;
    case 'presend':doSendOtp();break;
    case 'pfill':S.pl.code=S.pl.otp||'';doVerify();break;
    case 'emerg':setEmergency(id,true);break;
    case 'unemerg':setEmergency(id,false);break;
    case 'noshow':setStatus(id,'no_show');break;
    case 'complete':setStatus(id,'done',{doneAt:Date.now()});break;
    case 'callnext':callNext(id);break;
    case 'docview':S.docView=v;render();break;
    case 'walktoggle':S.walkOpen=!S.walkOpen;render();break;
    case 'addwalk':addWalkIn();break;
    case 'remind':{var ap=Store.appts.get(id);if(ap){S.reminder={id:id,text:reminderText(ap)};render()}break}
    case 'closeremind':S.reminder=null;render();break;
    case 'copyremind':if(S.reminder)copyText(S.reminder.text);break;
    case 'sample':loadSample();break;
    case 'clearsample':clearSample();break;
  }
});
document.addEventListener('input',function(e){
  var tg=e.target;
  if(tg.dataset.f){S.form[tg.dataset.f]=tg.value}
  else if(tg.dataset.w){S.walk[tg.dataset.w]=tg.value}
  else if(tg.dataset.l){S.login[tg.dataset.l]=tg.value}
  else if(tg.dataset.p){S.pl[tg.dataset.p]=tg.value;if(tg.dataset.p==='code'&&/^\d{4}$/.test(tg.value.trim()))doVerify()}
  else if(tg.dataset.s==='deskQ'){S.deskQ=tg.value;render()}
});
document.addEventListener('change',function(e){
  var tg=e.target;
  if(tg.id==='lang'){S.lang=tg.value;try{localStorage.setItem('aq.lang',S.lang)}catch(_){}render()}
  else if(tg.dataset.s==='deskDoc'){S.deskDoc=tg.value;render()}
  else if(tg.dataset.w==='doctor'){S.walk.doctor=tg.value}
});
document.addEventListener('submit',function(e){e.preventDefault();if(e.target.id==='loginForm')doLogin();else if(e.target.id==='pLoginForm'){if(S.pl.step==='code')doVerify();else doSendOtp()}});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='lookup'){doLookup()}
  if(e.key==='Enter'&&(e.target.id==='p-phone'||e.target.id==='p-code')){e.preventDefault();if(S.pl.step==='code')doVerify();else doSendOtp()}
  if(e.key==='Enter'&&(e.target.id==='l-id'||e.target.id==='l-pin')){e.preventDefault();doLogin()}
  if(e.key==='Escape'&&S.terms){S.terms=false;render()}
});

/* ---------- start ---------- */
(function(){var sel=$('#lang');sel.innerHTML=LANGS.map(function(l){return '<option value="'+l+'">'+LANG_NAME[l]+'</option>'}).join('');sel.value=S.lang})();
try{var sa=sessionStorage.getItem('aq.staff');if(sa)S.staffAuth=sa}catch(_){}
try{var pa=sessionStorage.getItem('aq.patient');if(pa){S.patAuth=pa;remember(null,pa)}}catch(_){}
if(limStatus('staff').locked||limStatus('lookup').locked||limStatus('patient').locked||limStatus('otp').locked)ensureTicker();
render();
Store.on(render);
setInterval(render,30000);

function startLocal(){
  makeSample(Date.now()).forEach(function(a){Store.appts.set(a.id,a)});
  S.mode='demo';render();
}
(function init(){
  if(!window.claude||!window.claude.use){startLocal();return}
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];
    var p=user?Promise.all([user.id(),user.can('data.write')]):Promise.resolve([null,null]);
    return p.then(function(u){
      Store.uid=u[0];S.readOnly=(u[1]===false);
      if(!db){startLocal();return}
      Store.db=db;
      db.collection('appts').onSnapshot(function(snap){
        var m=new Map();snap.docs.forEach(function(d){var x=d.data();x.id=d.id;m.set(d.id,x)});
        Store.appts=m;S.mode='live';render();
      },function(){S.mode='demo';render();toast('Lost the connection to the shared data.')});
    });
  }).catch(startLocal);
})();
})();
</script>

</body></html>
